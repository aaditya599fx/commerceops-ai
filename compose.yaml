services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: commerceops
      POSTGRES_USER: commerceops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceops"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://commerceops:${POSTGRES_PASSWORD}@postgres/commerceops
      WORKER_ENABLED: "false"
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./runtime:/app/runtime
    depends_on:
      postgres:
        condition: service_healthy
  n8n:
    image: n8nio/n8n:2.4.4
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set a random N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Kolkata
      COMMERCEOPS_API_URL: http://api:8000
    ports: ["127.0.0.1:5678:5678"]
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    depends_on: [api]
volumes:
  postgres_data:
  n8n_data:
