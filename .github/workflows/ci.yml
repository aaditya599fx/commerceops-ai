name: Test CommerceOps
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      APP_MODE: fixture
      APP_TOKEN: ci-test-token-long-enough-no-real-credential
      DATABASE_URL: sqlite:///./runtime/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/verify_exports.py
      - run: python scripts/build_review_bundle.py
      - run: python scripts/evaluate.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-reliability
          path: evidence/reliability.*
